<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 20px; }
        .container { background: #fff; padding: 20px; max-width: 400px; margin: auto; border-radius: 8px; }
        .error { color: red; font-size: 14px; }
        .success { background: #d4ffd4; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 10px 0; }
        button { padding: 10px; width: 100%; background: #2a8; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #1a6; }
    </style>
</head>

<body>

<div class="container">
    <h2>User Registration</h2>

    <!-- Success message -->
    <?php if (isset($_GET['success'])): ?>
        <div class="success">Registration successful!</div>
    <?php endif; ?>

    <!-- Error message -->
    <?php if (isset($_GET['error'])): ?>
        <div class="error"><?php echo htmlspecialchars($_GET['error']); ?></div>
    <?php endif; ?>

    <form method="POST" action="registration.php">

        <label>Name:</label>
        <input type="text" name="name">

        <label>Email:</label>
        <input type="text" name="email">

        <label>Password:</label>
        <input type="password" name="password">

        <label>Confirm Password:</label>
        <input type="password" name="confirm_password">

        <button type="submit">Register</button>

    </form>
</div>

</body>
</html>
